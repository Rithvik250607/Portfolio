<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0a192f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="arc-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bg-glow)" rx="24"/>

  <!-- Cybernetic Grid Overlay -->
  <g stroke="rgba(0, 240, 255, 0.12)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>

    <line x1="0" y1="50" x2="500" y2="50"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="0" y1="450" x2="500" y2="450"/>
  </g>

  <!-- Concentric HUD Rings Behind Silhouette -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" stroke-dasharray="10 6"/>
  <circle cx="250" cy="220" r="140" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="25 15 5 15"/>
  <circle cx="250" cy="220" r="120" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>

  <!-- Stylized Tech Developer Silhouette -->
  <!-- Shoulders & Upper Body -->
  <path d="M120 480 C120 380, 160 340, 210 330 L220 270 L280 270 L290 330 C340 340, 380 380, 380 480 Z" fill="#0f172a" stroke="url(#neon-cyan)" stroke-width="2"/>
  
  <!-- Chest Armor Line & Detail -->
  <path d="M170 420 L220 370 L280 370 L330 420" fill="none" stroke="url(#gold-grad)" stroke-width="2"/>
  <path d="M250 330 L250 370" fill="none" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5"/>

  <!-- Chest Arc Reactor on Avatar -->
  <circle cx="250" cy="400" r="30" fill="#030712" stroke="url(#neon-cyan)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="250" cy="400" r="20" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="250" cy="400" r="12" fill="url(#arc-core)" filter="url(#intense-glow)"/>

  <!-- Head & Hair Silhouette -->
  <ellipse cx="250" cy="210" rx="60" ry="72" fill="#1e293b" stroke="url(#neon-cyan)" stroke-width="1.5"/>
  <!-- Hair Contour -->
  <path d="M190 200 C190 140, 230 130, 250 130 C275 130, 310 140, 310 200 C300 170, 280 155, 250 155 C220 155, 200 170, 190 200 Z" fill="#334155"/>
  
  <!-- J.A.R.V.I.S Hologram Eyepiece / Augmented HUD Glasses -->
  <path d="M210 205 L245 205 L240 220 L215 220 Z" fill="rgba(0, 240, 255, 0.4)" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)"/>
  <path d="M255 205 L290 205 L285 220 L260 220 Z" fill="rgba(0, 240, 255, 0.4)" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="245" y1="208" x2="255" y2="208" stroke="#00f0ff" stroke-width="1.5"/>

  <!-- Tech Targeting Reticle -->
  <circle cx="250" cy="220" r="85" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="150" y1="220" x2="165" y2="220" stroke="#00f0ff" stroke-width="2"/>
  <line x1="335" y1="220" x2="350" y2="220" stroke="#00f0ff" stroke-width="2"/>
  <line x1="250" y1="120" x2="250" y2="135" stroke="#00f0ff" stroke-width="2"/>
  <line x1="250" y1="305" x2="250" y2="320" stroke="#00f0ff" stroke-width="2"/>

  <!-- HUD Corner Brackets -->
  <path d="M25 60 L25 25 L60 25" fill="none" stroke="#00f0ff" stroke-width="3"/>
  <path d="M475 60 L475 25 L440 25" fill="none" stroke="#00f0ff" stroke-width="3"/>
  <path d="M25 440 L25 475 L60 475" fill="none" stroke="#00f0ff" stroke-width="3"/>
  <path d="M475 440 L475 475 L440 475" fill="none" stroke="#00f0ff" stroke-width="3"/>

  <!-- Tech Telemetry Text -->
  <text x="35" y="45" font-family="'Courier New', monospace" font-size="11" fill="#00f0ff" letter-spacing="2">STARK_OS // BIOMETRIC_ID</text>
  <text x="35" y="60" font-family="'Courier New', monospace" font-size="9" fill="#f59e0b" letter-spacing="1">SUBJECT: RITHVIK P R</text>
  <text x="360" y="45" font-family="'Courier New', monospace" font-size="11" fill="#00f0ff" letter-spacing="2">MARK LXXXV</text>
  <text x="360" y="60" font-family="'Courier New', monospace" font-size="9" fill="#22c55e" letter-spacing="1">STATUS: ONLINE</text>
  <text x="35" y="465" font-family="'Courier New', monospace" font-size="10" fill="rgba(0, 240, 255, 0.7)">CORE SYNC: 100%</text>
  <text x="330" y="465" font-family="'Courier New', monospace" font-size="10" fill="rgba(0, 240, 255, 0.7)">AI PROTOCOL: ACTIVE</text>
</svg>
